<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Yooco WeChat Style Lab</title>
  <desc id="desc">Paste an article, let AI choose a theme and parameters, then copy WeChat-ready HTML. Right side shows six theme specimens.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F4EC"/>
      <stop offset="100%" stop-color="#EDE8DC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#paper)"/>
  <rect x="24" y="24" width="1152" height="332" rx="22" fill="none" stroke="#D9D2C3" stroke-width="1.5"/>
  <rect x="64" y="56" width="44" height="44" rx="12" fill="#141414"/>
  <text x="86" y="87" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#C8F000">Y</text>
  <text x="122" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#7A7468">WECHAT STYLE LAB</text>
  <text x="122" y="112" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="800" fill="#141414">Yooco</text>
  <text x="64" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="600" fill="#2A2A2A">把一篇好文章，排成读者愿意读完的样子</text>
  <text x="64" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#5C574C">粘贴原文 → AI 选主题与参数 → 一键复制进微信</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6E675C">
    <text x="64" y="268">repo · yocoTextDesign</text>
    <text x="64" y="296">6 themes · classic lab · WeChat-ready HTML</text>
  </g>
  <g transform="translate(720 54)">
    <rect x="18" y="18" width="360" height="250" rx="18" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1.5"/>
    <text x="42" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#141414">精选主题</text>
    <text x="42" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8A8578">THEME SPECIMENS</text>
    <g transform="translate(42 100)">
      <rect width="16" height="16" rx="4" fill="#0a9d75"/>
      <text x="28" y="13" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" fill="#2A2A2A">清氧绿</text>
      <text x="200" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8A8578">教程</text>
      <rect y="28" width="16" height="16" rx="4" fill="#d43d33"/>
      <text x="28" y="41" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" fill="#2A2A2A">朱白评论</text>
      <text x="200" y="41" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8A8578">观点</text>
      <rect y="56" width="16" height="16" rx="4" fill="#52525b"/>
      <text x="28" y="69" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" fill="#2A2A2A">素墨</text>
      <text x="200" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8A8578">长文</text>
      <rect y="84" width="16" height="16" rx="4" fill="#476055"/>
      <text x="28" y="97" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" fill="#2A2A2A">静山</text>
      <text x="200" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8A8578">随笔</text>
      <rect y="112" width="16" height="16" rx="4" fill="#0f9d8a"/>
      <text x="28" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" fill="#2A2A2A">票据卡</text>
      <text x="200" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8A8578">清单</text>
      <rect y="140" width="16" height="16" rx="4" fill="#1e1f23"/>
      <rect x="2" y="142" width="12" height="12" rx="2" fill="#e07b2c"/>
      <text x="28" y="153" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" fill="#2A2A2A">手札橙</text>
      <text x="200" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8A8578">复盘</text>
    </g>
  </g>
  <rect x="64" y="328" width="72" height="6" rx="3" fill="#C8F000"/>
</svg>