<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">Yooco workflow</title>
  <desc id="wdesc">Four steps: paste article, AI optimize layout, tune theme parameters, copy into WeChat editor.</desc>
  <rect width="1200" height="280" rx="28" fill="#141414"/>
  <text x="56" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#8A9A40">WORKFLOW</text>
  <text x="56" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#F7F4EC">从原文到可发布排版</text>
  <g transform="translate(56 130)">
    <rect width="240" height="100" rx="16" fill="#1F1F1F" stroke="#333" stroke-width="1.5"/>
    <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C8F000">01</text>
    <text x="24" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#F7F4EC">粘贴原文</text>
  </g>
  <path d="M310 180 H346" stroke="#C8F000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="346,172 362,180 346,188" fill="#C8F000"/>
  <g transform="translate(378 130)">
    <rect width="240" height="100" rx="16" fill="#1F1F1F" stroke="#333" stroke-width="1.5"/>
    <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C8F000">02</text>
    <text x="24" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#F7F4EC">AI 优化排版</text>
  </g>
  <path d="M632 180 H668" stroke="#C8F000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="668,172 684,180 668,188" fill="#C8F000"/>
  <g transform="translate(700 130)">
    <rect width="240" height="100" rx="16" fill="#1F1F1F" stroke="#333" stroke-width="1.5"/>
    <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C8F000">03</text>
    <text x="24" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#F7F4EC">调主题参数</text>
  </g>
  <path d="M954 180 H990" stroke="#C8F000" stroke-width="3" stroke-linecap="round"/>
  <polygon points="990,172 1006,180 990,188" fill="#C8F000"/>
  <g transform="translate(1022 130)">
    <rect width="122" height="100" rx="16" fill="#C8F000"/>
    <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#141414">04</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#141414">复制</text>
    <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#141414">进微信</text>
